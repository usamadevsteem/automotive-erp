<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <rect width="400" height="280" fill="#f1f5f9"/>
  <g transform="translate(80, 80)">
    <!-- Car body -->
    <rect x="20" y="70" width="200" height="60" rx="8" fill="#cbd5e1"/>
    <!-- Roof -->
    <path d="M60 70 L80 30 L160 30 L180 70 Z" fill="#94a3b8"/>
    <!-- Windows -->
    <rect x="85" y="35" width="35" height="28" rx="3" fill="#e2e8f0"/>
    <rect x="125" y="35" width="35" height="28" rx="3" fill="#e2e8f0"/>
    <!-- Wheels -->
    <circle cx="70" cy="130" r="22" fill="#475569"/>
    <circle cx="70" cy="130" r="12" fill="#94a3b8"/>
    <circle cx="170" cy="130" r="22" fill="#475569"/>
    <circle cx="170" cy="130" r="12" fill="#94a3b8"/>
    <!-- Headlight -->
    <rect x="20" y="85" width="18" height="10" rx="3" fill="#fef3c7"/>
    <!-- Taillight -->
    <rect x="202" y="85" width="18" height="10" rx="3" fill="#fee2e2"/>
  </g>
  <text x="200" y="220" text-anchor="middle" font-family="system-ui" font-size="13" fill="#94a3b8">No Photo Available</text>
</svg>
